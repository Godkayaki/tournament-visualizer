name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5,13 * * *"   # refresh data daily
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild all data from scratch"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore cached tournament data
        uses: actions/cache@v4
        with:
          path: site/data
          key: topdeck-data-${{ github.run_id }}
          restore-keys: topdeck-data-
      - name: Fetch tournament data
        run: node scripts/fetch-data.mjs
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
          # code-only pushes reuse the cache; scheduled/manual runs fetch only the latest 30 days
          SKIP_IF_CACHED: ${{ github.event_name == 'push' && '1' || '' }}
          FULL: ${{ inputs.full && '1' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
