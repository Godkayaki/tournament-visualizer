name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: "15 5 * * *"  # refresh data daily (5:15 AM)
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild all data from scratch"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bump version (code pushes only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          node scripts/bump-version.mjs
          git add version-number
          git commit -m "Bump version to $(cat version-number)"
          git push
      - name: Restore cached tournament data
        uses: actions/cache@v4
        with:
          path: site/data
          key: topdeck-data-${{ github.run_id }}
          restore-keys: topdeck-data-
      - name: Fetch tournament data
        run: node scripts/fetch-data.mjs
        env:
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
          # code-only pushes reuse the cache; scheduled/manual runs fetch only the latest 30 days
          SKIP_IF_CACHED: ${{ github.event_name == 'push' && '1' || '' }}
          FULL: ${{ inputs.full && '1' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
