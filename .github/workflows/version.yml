name: Bump version

on:
  push:
    branches: [main]
    # Code-only: changes under site/data/ come from the scheduled data workflow and
    # shouldn't bump the version (that's a data refresh, not a code change).
    paths-ignore:
      - 'site/data/**'
      - 'version-number'

# Only one bump at a time; a second push while the first is running would race on the file.
concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 1 is fine — we only need the tip to write back.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Bump version-number
        run: node scripts/bump-version.mjs

      - name: Commit and push
        run: |
          NEW=$(cat version-number)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-number
          git commit -m "chore: bump version to ${NEW} [skip ci]"
          git push